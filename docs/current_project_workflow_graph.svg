<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">부동산 매물관리 도구 현재 업무 흐름</title>
  <desc id="desc">매물, 상담, 계약, 오늘 할 일, 광고관리의 연결 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#475569"/></marker>
    <style>
      .title{font:700 26px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#0f172a}.sub{font:14px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#475569}.node{stroke-width:2;rx:14;ry:14}.label{font:700 18px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#0f172a;text-anchor:middle}.small{font:14px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#334155;text-anchor:middle}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#arrow)}.caption{font:13px 'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#475569;text-anchor:middle}
    </style>
  </defs>
  <rect width="1200" height="760" fill="#f8fafc"/>
  <text x="600" y="44" class="title" text-anchor="middle">부동산 매물관리 도구 — 현재 업무 흐름</text>
  <text x="600" y="70" class="sub" text-anchor="middle">매물 관리 · 상담 관리 · 계약 관리 · 오늘 할 일 · 월별 광고비</text>

  <rect x="55" y="130" width="205" height="108" class="node" fill="#dbeafe" stroke="#2563eb"/>
  <text x="158" y="169" class="label">매물 등록·수정</text><text x="158" y="198" class="small">건물 · 호실 · 매물 회차</text><text x="158" y="219" class="small">최신 조건만 수정</text>
  <rect x="55" y="420" width="205" height="108" class="node" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="158" y="459" class="label">건물·호실 관리</text><text x="158" y="488" class="small">고정정보 · 기존 옵션</text><text x="158" y="509" class="small">매물 이력 확인</text>

  <rect x="365" y="130" width="235" height="108" class="node" fill="#dcfce7" stroke="#16a34a"/>
  <text x="483" y="169" class="label">상담관리</text><text x="483" y="198" class="small">희망 조건 · 활동 이력</text><text x="483" y="219" class="small">다음 연락일 수동 입력</text>
  <rect x="365" y="420" width="235" height="108" class="node" fill="#fef3c7" stroke="#d97706"/>
  <text x="483" y="459" class="label">오늘 할 일</text><text x="483" y="488" class="small">오늘 · 지연 · D-1 잔금</text><text x="483" y="509" class="small">완료 체크는 원본 미변경</text>

  <rect x="705" y="130" width="235" height="108" class="node" fill="#fae8ff" stroke="#a21caf"/>
  <text x="823" y="169" class="label">계약관리</text><text x="823" y="198" class="small">원본 상담 연결 · 단계 이력</text><text x="823" y="219" class="small">잔금·계약 일정</text>
  <rect x="985" y="420" width="165" height="108" class="node" fill="#f1f5f9" stroke="#64748b"/>
  <text x="1068" y="459" class="label">광고관리</text><text x="1068" y="488" class="small">월별 광고비</text><text x="1068" y="509" class="small">광고 문구 만들기</text>

  <rect x="705" y="420" width="235" height="108" class="node" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="823" y="459" class="label">계약 상태 연동</text><text x="823" y="488" class="small">진행 · 잔금 예정 · 완료</text><text x="823" y="509" class="small">해지 · 만료</text>

  <path d="M260 184 H365" class="line"/><text x="312" y="170" class="caption">상담 당시 매물 연결</text>
  <path d="M600 184 H705" class="line"/><text x="653" y="170" class="caption">원본 상담 연결</text>
  <path d="M823 238 V420" class="line"/><text x="875" y="335" class="caption">계약 상태 반영</text>
  <path d="M705 474 H260" class="dash"/><text x="485" y="459" class="caption">매물 상태 변경</text>
  <path d="M483 238 V420" class="dash"/><text x="574" y="334" class="caption">다음 연락·집중 대응</text>
  <path d="M260 474 H365" class="line"/><text x="312" y="459" class="caption">매물 이력 조회</text>
  <path d="M940 474 H985" class="dash"/><text x="962" y="459" class="caption">독립 관리</text>

  <rect x="170" y="628" width="860" height="70" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="600" y="657" class="label">데이터 안전 원칙</text>
  <text x="600" y="681" class="small">저장·수정·삭제 뒤 SQLite 백업과 무결성 검사 · 기존 상담값과 호실 옵션은 보존 · 매물별 광고 연결은 사용하지 않음</text>
</svg>
